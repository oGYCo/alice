version: '3.9'

services:
  postgres-test:
    image: postgres:16
    container_name: alice-postgres-test
    environment:
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: alice
      POSTGRES_DB: alice_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-test:
    image: redis:7
    container_name: alice-redis-test
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_test_data:
  redis_test_data:
