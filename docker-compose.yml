version: '3.9'

services:
  api:
    build: .
    container_name: alice-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://alice:alice@postgres:5432/alice"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      REDIS_URL: "redis://redis:6379/0"
      MEILISEARCH_URL: "http://meilisearch:7700"
    command: ["uv", "run", "uvicorn", "alice.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    container_name: alice-bot
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://alice:alice@postgres:5432/alice"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      REDIS_URL: "redis://redis:6379/0"
      MEILISEARCH_URL: "http://meilisearch:7700"
    command: ["uv", "run", "python", "-m", "alice.bot.main"]

  worker:
    build: .
    container_name: alice-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://alice:alice@postgres:5432/alice"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      REDIS_URL: "redis://redis:6379/0"
      MEILISEARCH_URL: "http://meilisearch:7700"
    command: ["uv", "run", "celery", "-A", "alice.worker.celery_app", "worker", "--loglevel=info"]

  scheduler:
    build: .
    container_name: alice-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://alice:alice@postgres:5432/alice"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      REDIS_URL: "redis://redis:6379/0"
      MEILISEARCH_URL: "http://meilisearch:7700"
    command: ["uv", "run", "celery", "-A", "alice.worker.celery_app", "beat", "--loglevel=info"]

  postgres:
    image: postgres:16
    container_name: alice-postgres
    environment:
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: alice
      POSTGRES_DB: alice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    container_name: alice-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: alice-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_API_KEY:-masterKey}"
      MEILI_ENV: "development"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
