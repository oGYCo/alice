[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alice"
version = "0.1.0"
description = "Alice — AI Secretary: Personal intelligent information manager"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenCode Contributors" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "trafilatura>=1.6.0",
    "feedparser>=6.0.0",
    "arxiv>=2.1.0",
    "aiogram>=3.3.0",
    "openai>=1.6.0",
    "ollama>=0.1.0",
    "meilisearch>=0.31.0",
    "neo4j>=5.0",
    "leidenalg>=0.11.0",
    "python-igraph>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "anyio>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests requiring a real database (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
